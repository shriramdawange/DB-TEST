<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students | College Portal</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127891;</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">CP</span>
        <span class="brand-text">
          <strong>College Portal</strong>
          <small>Students Record Portal</small>
        </span>
      </a>
      <button type="button" class="btn btn-primary" id="add-student-btn">
        <span aria-hidden="true">+</span> Add Student
      </button>
    </div>
  </header>

  <main class="container page">
    <section class="card">
      <div class="card-header">
        <div>
          <h1 class="card-title">Student Records</h1>
          <p class="card-subtitle" id="result-count">Loading students...</p>
        </div>

        <div class="search">
          <label class="sr-only" for="search-input">Search students</label>
          <input
            type="search"
            id="search-input"
            class="input search-input"
            placeholder="Search by name or mobile..."
            autocomplete="off"
          />
          <button
            type="button"
            class="search-clear"
            id="search-clear"
            title="Clear search"
            aria-label="Clear search"
            hidden
          >
            &times;
          </button>
        </div>
      </div>

      <!-- Loading state -->
      <div class="loading" id="loading">
        <span class="spinner" aria-hidden="true"></span>
        <p>Loading students...</p>
      </div>

      <!-- Error state -->
      <div class="state state-error" id="error-state" hidden>
        <h2>Something went wrong</h2>
        <p id="error-message"></p>
      </div>

      <!-- Empty state -->
      <div class="state state-empty" id="empty-state" hidden>
        <div class="state-icon" aria-hidden="true">&#128196;</div>
        <h2>No students found</h2>
        <p data-empty-text>No students yet. Add your first student to get started.</p>
        <button type="button" class="btn btn-primary" onclick="window.location.href='add.html'">
          + Add Student
        </button>
      </div>

      <!-- Table -->
      <div class="table-wrap" id="students-table" hidden>
        <table class="table">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Name</th>
              <th scope="col">Year</th>
              <th scope="col">Degree</th>
              <th scope="col">Mobile</th>
              <th scope="col" class="right">Actions</th>
            </tr>
          </thead>
          <tbody id="students-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>College Students Record Portal &mdash; Node.js + Express + SQLite</p>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/list.js"></script>
</body>
</html>
